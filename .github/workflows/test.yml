name: Test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-slim]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/install.sh
      - run: shellcheck scripts/install.sh
      - id: setup
        uses: ./
        with: { version: 0.22.0 }
      - run: test -x "${{ steps.setup.outputs.path }}" && emmylua_check --version
      - name: Verify problem matcher
        shell: bash
        run: |
          output="$(emmylua_check test/fixtures/lua-cases/invalid-local-assignment)"
          printf '%s\n' "$output"
          grep -F -- '--> test/fixtures/lua-cases/invalid-local-assignment/main.lua:2:7' <<<"$output"
      - run: npm test
