name: Setup EmmyLua Check

description: Download emmylua_check for Ubuntu runners, add it to PATH, and register diagnostics annotations.
author: scarf

inputs:
  version:
    description: EmmyLua Analyzer Rust release tag to use. Use latest for the latest release.
    required: false
    default: latest
  repository:
    description: GitHub repository that publishes emmylua_check release assets.
    required: false
    default: EmmyLuaLs/emmylua-analyzer-rust
  asset:
    description: Ubuntu release asset name to download. Defaults to the current Ubuntu runner architecture.
    required: false
    default: ""
  token:
    description: GitHub token for release API requests.
    required: false
    default: ""

outputs:
  version:
    description: Resolved release tag.
    value: ${{ steps.install.outputs.version }}
  asset:
    description: Downloaded release asset name.
    value: ${{ steps.install.outputs.asset }}
  path:
    description: Installed emmylua_check path.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_ASSET: ${{ inputs.asset }}
        INPUT_TOKEN: ${{ inputs.token }}
